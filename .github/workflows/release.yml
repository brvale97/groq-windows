name: Release Windows app

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: .\build-app.ps1 -Bridge

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The zip is the folder build that 0.2.0+ installs; the single exe is
          # the bridge for updaters up to 0.1.27, which replace exactly one file.
          files: |
            dist/GroqInsertDictation-win64.zip
            dist/GroqInsertDictation.exe
            dist/GroqInsertDictation.build.json
          generate_release_notes: true
